[project]
name = "arrowspace-mcp"
version = "0.30.0"
description = "MCP server for ArrowSpace spectral vector search"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Genefold AI Ltd", email = "coderbot@genefold.ai" },
]
dependencies = [
    "anyio",
    "arrowspace>=0.30.0",
    "filelock>=3.20",
    "httpx>=0.28.1",
    "mcp>=1.28",
    "numpy",
    "uvicorn",
    "zarr>=3.0",
]

[project.optional-dependencies]
spectral = ["scipy", "scikit-learn"]
embeddings = ["sentence-transformers>=5.2,<6", "transformers>=4.41,<5"]
all = ["arrowspace-mcp[spectral,embeddings]"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arrowspace_mcp*"]

[dependency-groups]
dev = [
    "anyio>=4.14.1",
    "mcp>=1.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
arrowspace-mcp = "arrowspace_mcp.__main__:main"
arrowspace-embed = "arrowspace_mcp.embeddings:main"
arrowspace-ingest = "arrowspace_mcp.ingestion:main"

[project.urls]
Homepage = "https://github.com/Genefold/arrowspace-mcp"
Source = "https://github.com/Genefold/arrowspace-mcp"
